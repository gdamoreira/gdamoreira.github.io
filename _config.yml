# about_title: About Me
about_profile_image: images/profile.jpg
about_content: |
  I'm a senior software engineer and technical leader based in Barcelona, open to remote work. For 15+ years I've designed, scaled and secured distributed backend platforms across PropTech, cybersecurity, FinTech and enterprise SaaS — owning the architecture end to end, not just the tickets. That is the scope I'm ready to take on as a Staff Engineer.

  My home ground is event-driven systems on the JVM: Kotlin and Java, Quarkus and Spring Boot, Apache Kafka, PostgreSQL, running on AWS and Kubernetes. What sets me apart is the security side. I spent more than three years as an application security engineer at Oracle, so threat modeling, static analysis and a secure SDLC are part of how I design systems rather than a review at the end.

  I've led at every scale: tech lead of the platform behind a US$100 million exit, CTO of a B2B startup, and today the engineer who sets architecture and engineering standards across backend services. I also design and maintain [Snodra](https://snodra.damoreira.com), an open-source messaging stack for services that speak events and gRPC.

