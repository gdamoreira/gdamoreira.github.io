  - title: A Little More About Me
    layout: text
    content: |
      Outside work I keep a home lab: two Proxmox hosts running Kubernetes, Kafka, PostgreSQL, GitLab, Harbor and Nexus, all provisioned with Terraform and Ansible. It's where I try things before I recommend them at work.

      - Gym
      - Gaming
      - Reading
      - Practicing Karate
      - Studying new technologies

  - title: Get in touch
    layout: text
    content: |
      I'm open to remote senior backend roles, especially on teams working in Kotlin or Java. If that's you, email me at [guilherme@damoreira.com.br](mailto:guilherme@damoreira.com.br) — I'm happy to talk.

