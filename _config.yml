  - title: Projects
    layout: list
    content:
      - layout: top-middle
        title: Snodra — open-source messaging for services that speak events and gRPC
        link: snodra.damoreira.com
        quote: >
          I design and maintain Snodra: commands, queries, events and sagas over the gRPC and Kafka a team already runs — with no broker in the request path, no proprietary event store and no per-node licence.
        description: |
          Snodra is a CQRS-style messaging stack for service fleets. Services send commands and queries, and a stateless router forwards each one to a live handler of the right type, enforcing deadlines, retries, priority and streaming at the router. Events never pass through it: they are written through a transactional outbox, in the same database transaction as the state they describe, and relayed to idempotent processors. Sagas coordinate long-running processes with associations and deadlines.

          I own the whole design, from the wire protocol to the documentation:

          - **Snodra Server** — a stateless gRPC router and control plane written in Rust. It stores nothing and queues nothing, so every instance is independent and scaling out needs no server-to-server traffic. The dashboard and service topology are served from the same binary.
          - **Client libraries in several languages** — Kotlin with a Spring Boot starter (published to Maven Central), Rust (crates.io) and Go, with Python in progress.
          - **A conformance suite** — every client is checked against a real server, so the protocol, not any single implementation, is the stable contract.
          - **Pluggable stores** — Kafka or RabbitMQ Streams for events; PostgreSQL, MySQL or MongoDB for messages.
          - **Security and operations built in** — static token, OAuth2/OIDC JWT or mTLS with per-service ACLs, OpenTelemetry metrics and health probes.

          The project is pre-1.0 and released under Apache-2.0. Source: [github.com/snodra](https://github.com/snodra).

          **Stack:** Rust, tonic, gRPC, Kotlin, Spring Boot, Go, Apache Kafka, RabbitMQ Streams, PostgreSQL, MySQL, MongoDB, OpenTelemetry, Docker

      - layout: top-middle
        title: Charlie — the 3D render farm behind Decora's US$100 million exit
        link: creativedrive.com
        quote: >
          I led the team behind the Java, Spring Boot and Python platform that ran Decora's 3D production — work that helped take a 15-person startup to a US$100 million acquisition.
        description: |
          In 2016 I joined Decora, then a small team in Florianópolis building an online interior design marketplace. Architects were delivering photorealistic 3D renders alongside their projects, and retailers such as Target, Lowe's and Bed Bath & Beyond had a problem worth solving: they sold products made overseas and had no affordable way to photograph them in context. Decora pivoted from a consumer marketplace into a B2B 3D content platform, and I helped build the engineering behind that pivot.

          We built the platform in Java and Spring Boot, using CQRS and microservices to keep the workflow and the render jobs independent. The part I'm proudest of is the production pipeline: a desktop application that integrated with 3ds Max through MaxScript, positioning assets, running V-Ray renders, validating geometry, textures, lighting and output resolution, and exporting to FBX and GLB. Behind it, Python services piped jobs to the render farm, tracked them, and pulled the results back automatically.

          Later I helped build a real-time scene composer, first in Unreal Engine and then in Unity, which let designers drag validated assets into a scene, change materials, and push the finished scene to the render farm for high-resolution output.

          Decora grew from about 15 people to over 150, and in March 2018 CreativeDrive acquired it for US$100 million — the second-largest Brazilian tech deal that year. By that point Decora was producing more than 15,000 3D product models and 7,000 scenes a month. CreativeDrive was later acquired by Accenture. I owned technical and product problems end to end, from microservice design to MaxScript and render-farm capacity.

          **Stack:** Python, Java, Spring Boot, CQRS, Kafka, MaxScript, 3ds Max, V-Ray, Unity, Unreal Engine, MongoDB, Redis, AWS

