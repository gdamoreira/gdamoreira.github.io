# about_title: About Me
about_profile_image: images/profile.jpg
about_content: |
  I'm a senior software engineer and technical lead based in Barcelona, available for remote roles. Over the past 15 years, I've built backend platforms across PropTech, cybersecurity, FinTech, and enterprise SaaS, taking responsibility for architecture, system reliability, and delivery.

  Most of my work is in Kotlin, Java, and Python, building event-driven services with Quarkus, Spring Boot, Apache Kafka, and PostgreSQL on AWS and Kubernetes. Having spent over three years as an application security engineer at Oracle, I bring threat modeling, static analysis, and secure engineering practices directly into day-to-day architecture.

  I've worked at different company stages: tech lead on the 3D automation platform behind Decora's US$100 million acquisition, CTO of a B2B startup, and senior engineer guiding backend standards. In my own time, I build and maintain [Snodra](https://snodra.damoreira.com), an open-source messaging stack for event-driven systems and gRPC.

