  - title: Projects
    layout: list
    content:
      - layout: top-middle
        title: Snodra — open-source messaging for services that speak events and gRPC
        link: snodra.damoreira.com
        quote: >
          An open-source messaging stack for service fleets: routing commands, queries, events, and sagas over gRPC and Kafka without centralized message brokers.
        description: |
          Snodra is a CQRS-style messaging framework for distributed service architectures. Services send commands and queries to a stateless Rust router, which routes them directly to live handlers with support for timeouts, retries, and streaming. Events are written through a transactional outbox pattern alongside local database updates and streamed to idempotent consumers. Sagas coordinate multi-step workflows with deadlines.

          I handle the system design, wire protocol, and documentation:

          - **Snodra Server:** a stateless gRPC router and control plane written in Rust with zero persistent state, allowing horizontal scaling without cluster coordination.
          - **Client libraries:** Kotlin with a Spring Boot starter (published to Maven Central), Rust (crates.io), Go, and Python, with Node.js and C# on the roadmap.
          - **Protocol test suite:** an automated conformance suite that validates client behavior against live server instances.
          - **Pluggable storage:** Kafka or RabbitMQ Streams for events; PostgreSQL, MySQL, or MongoDB for outbox storage.
          - **Security:** token, OAuth2/OIDC, and mTLS support with per-service access controls.

          The project is open source and released under Apache-2.0. Source: [github.com/snodra](https://github.com/snodra).

          **Stack:** Rust, tonic, gRPC, Kotlin, Spring Boot, Go, Python, Apache Kafka, RabbitMQ Streams, PostgreSQL, MySQL, MongoDB, OpenTelemetry, Docker

      - layout: top-middle
        title: Charlie — the 3D render farm behind Decora's US$100 million exit
        link: creativedrive.com
        quote: >
          Led the engineering behind the 3D automation platform that scaled Decora from 15 to 150+ people, resulting in a US$100 million exit.
        description: |
          In 2016 I joined Decora, then a small interior design startup in Florianópolis. When we saw that major retailers struggled to stage and photograph overseas products in studios, Decora pivoted into a B2B 3D visualization platform. I was responsible for engineering the core backend and rendering automation.

          We built the backend in Java and Spring Boot with CQRS and microservices. For the production pipeline, I wrote desktop automation tools in MaxScript for 3ds Max to position assets, trigger V-Ray renders, run geometry and lighting quality checks, and export models to FBX and GLB. Behind it, Python services queued jobs across our render farm and retrieved completed renders automatically.

          We also developed a real-time scene composer tool in Unity that allowed designers to assemble 3D rooms with validated catalog models and send finished scenes to the farm for high-resolution output.

          Decora grew from 15 people to over 150 employees, producing 15,000+ 3D models and 7,000 digital scenes monthly. In March 2018, CreativeDrive acquired Decora for US$100 million (the second-largest Brazilian tech deal that year). CreativeDrive was later acquired by Accenture.

          **Stack:** Python, Java, Spring Boot, CQRS, Kafka, MaxScript, 3ds Max, V-Ray, Unity, Unreal Engine, MongoDB, Redis, AWS

