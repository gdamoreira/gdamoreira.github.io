# About Section
# about_title: About Me
about_profile_image: images/profile.jpg
about_content: |
  I'm a senior software engineer based in Barcelona, open to remote work. For the past few years I've been building backend platforms in Kotlin and Java — Spring Boot and Quarkus services, Kafka pipelines, PostgreSQL — for products where the numbers have to be right in real time.

  I started in 2009 and have worked across the stack since: payment platforms, hospital systems, a 3D rendering platform that helped a 15-person company grow to 150 people and sell for US$100 million, and application security at Oracle. That range helps when a problem crosses boundaries, and most of my best work has happened at those seams.

  I like small teams, clear architecture, and code someone else can pick up on a Monday. If you're hiring for a Kotlin or Java backend role — or you need someone who can think about security too — email me at [guilherme@damoreira.com.br](mailto:guilherme@damoreira.com.br).

content:
  - title: What I work with
    layout: text
    content: |
      - **Languages:** Kotlin, Java 17+, Python (automation and tooling), SQL
      - **Backend:** Spring Boot, Quarkus, Kafka, REST, CQRS, microservices
      - **Data:** PostgreSQL, MongoDB, Redis
      - **Cloud and delivery:** AWS, Docker, Kubernetes, Terraform, CI/CD (Jenkins, Bamboo)
      - **Security:** application security, static analysis, vulnerability management (ASPM)
      - **Leadership:** architecture, mentoring, technical direction

  - title: Projects
    layout: list
    content:
      - layout: top-middle
        title: Charlie — the 3D render farm behind Decora's US$100 million exit
        link: creativedrive.com
        quote: >
          I helped build the Java and Spring Boot platform that ran Decora's 3D production — work that helped take a 15-person startup to a US$100 million acquisition.
        description: |
          In 2016 I joined Decora, then a small team in Florianópolis building an online interior design marketplace. Architects were delivering photorealistic 3D renders alongside their projects, and retailers such as Target, Lowe's and Bed Bath & Beyond had a problem worth solving: they sold products made overseas and had no affordable way to photograph them in context. Decora pivoted from a consumer marketplace into a B2B 3D content platform, and I helped build the engineering behind that pivot.

          We built the platform in Java and Spring Boot, using CQRS and microservices to keep the workflow and the render jobs independent. The part I'm proudest of is the production pipeline: a desktop application that integrated with 3ds Max through MaxScript, positioning assets, running V-Ray renders, validating geometry, textures, lighting and output resolution, and exporting to FBX and GLB. Behind it, we piped jobs to the render farm, tracked them, and pulled the results back automatically.

          Later I helped build a real-time scene composer, first in Unreal Engine and then in Unity, which let designers drag validated assets into a scene, change materials, and push the finished scene to the render farm for high-resolution output.

          Decora grew from about 15 people to over 150, and in March 2018 CreativeDrive acquired it for US$100 million — the second-largest Brazilian tech deal that year. By that point Decora was producing more than 15,000 3D product models and 7,000 scenes a month. CreativeDrive was later acquired by Accenture. I owned technical and product problems end to end, from microservice design to MaxScript and render-farm capacity.

          **Stack:** Java, Spring Boot, CQRS, Kafka, MaxScript, 3ds Max, V-Ray, Unity, Unreal Engine, MongoDB, Redis, AWS

  - title: Experience
    layout: list
    content:
      - layout: left
        title: beyonnex.io
        link: beyonnex.io
        sub_title: Senior Software Engineer
        caption: August 2025 - Present
        quote: >
          Back on the platform that calculates heating costs in real time, now helping it reach more buildings across Germany.
        description: |
          After eight months at Phoenix Security, I returned to beyonnex in August 2025 to the same platform I helped build in 2023: a service that turns IoT meter readings into real-time heating costs for buildings in Germany.

          The work replaces manual, locally customized billing processes with a system that gives customers a live view of their consumption and cost, and room to adjust before the bill arrives. I work mostly in Kotlin and Quarkus, with Kafka moving meter data through the pipeline.

          **Stack:** Kotlin, Quarkus, Kafka, Gradle

      - layout: left
        title: Phoenix Security
        link: phoenix.security
        sub_title: Senior Software Engineer
        caption: January 2025 - August 2025
        quote: >
          Led development of an application security platform used to turn scattered findings into a prioritized risk list.
        description: |
          Phoenix Security is an ASPM product: it pulls vulnerability data from across a customer's infrastructure, applications and dependencies, then helps their security team decide what to fix first.

          I led development of the platform from design through deployment, working closely with product and security specialists. The stack was Spring Boot, Kotlin and Java 17 on the backend, Angular on the front end, and PostgreSQL for data.

          **Stack:** Kotlin, Java 17, Spring Boot, Angular, PostgreSQL

      - layout: left
        title: beyonnex.io
        link: beyonnex.io
        sub_title: Senior Software Engineer
        caption: November 2023 - December 2024
        quote: >
          Built the first version of a real-time heating-cost platform for the German market.
        description: |
          I joined beyonnex to help replace the manual, regionally customized systems that German utilities use to calculate heating costs.

          We built it in Kotlin and Quarkus, with Kafka carrying meter data through the pipeline and Gradle for the build. My focus was the backend: the services that calculate cost, handle the data flow, and keep the numbers consistent as volume grew.

          **Stack:** Kotlin, Quarkus, Kafka, Gradle

      - layout: left
        title: Oracle
        link: oracle.com
        sub_title: Senior Application Security Engineer
        caption: July 2020 - November 2023
        quote: >
          Made application security part of the development routine, not a review that happened at the end.
        description: |
          At Oracle I worked on application security for NetSuite, reviewing code and architecture for vulnerabilities and helping development teams fix the patterns rather than individual findings.

          I built internal tooling that automated code and static analysis, so reviewers could spend their time on judgment instead of triage. I also ran training sessions with developers on secure coding practice — the goal was fewer findings in the next release, not more reports.

          **Stack:** Java, static analysis (SAST), secure SDLC

      - layout: left
        title: FREE NOW (formerly mytaxi)
        link: free-now.com
        sub_title: Senior Software Engineer
        caption: December 2019 - May 2020
        quote: >
          Worked on the driver management system that keeps FREE NOW's driver, vehicle and company records accurate.
        description: |
          I worked on the driver management system at FREE NOW (formerly mytaxi): driver, vehicle and company profiles, plus registration, validation and the ongoing changes that keep those records accurate.

          The stack was Java, Kotlin, Spring Boot and Spring Cloud on AWS, with RabbitMQ, PostgreSQL, Docker and Kubernetes, delivered through Bamboo. I split my time between feature work, production issues and keeping the service stable.

          **Stack:** Java, Kotlin, Spring Boot, Spring Cloud, RabbitMQ, AWS, Kubernetes, PostgreSQL

      - layout: left
        title: Reticomm
        sub_title: Chief Technology Officer
        caption: October 2016 - October 2018
        quote: >
          Ran engineering and infrastructure for a corporate communication platform, concurrently with my lead role at Decora — both full-time roles.
        description: |
          Reticomm built a corporate communication platform: customers planned campaigns in images, text and video, scheduled delivery, and measured how their audience responded. As CTO I owned the technical direction, the system design and the infrastructure, and I managed the relationship with investors.

          The team built it in Java and JavaEE on WildFly and Tomcat, with Angular on the front end, PostgreSQL and Redis for data, and AWS for hosting. I stayed hands-on — the role was as much architecture and delivery as management.

          **Stack:** Java, JavaEE, Angular, PostgreSQL, Redis, AWS, WildFly

      - layout: left
        title: CreativeDrive (formerly Decora)
        link: creativedrive.com
        sub_title: Lead Software Engineer
        caption: March 2016 - November 2019
        quote: >
          Led the team that automated 3D production, cutting delivery time and making output consistent as volume grew.
        description: |
          I joined Decora as a technical lead and stayed through the pivot from consumer interior design to B2B 3D content, and through the acquisition by CreativeDrive.

          My team built the workflow that managed demand, distributed render jobs across the farm, and tracked the assets produced. Automating it cut delivery time, made output consistent, and let the company take on far more work without adding people proportionally.

          I split my time between architecture, code review, and keeping a growing system reliable. The stack was Java and Spring Boot with Kafka and Axon, Angular, MongoDB and Redis, running on AWS and Kubernetes.

          **Stack:** Java, Spring Boot, Kafka, Axon, Angular, MongoDB, Redis, Python, AWS, Kubernetes

      - layout: left
        title: Grupo Nexxera
        link: www.nexxera.com
        sub_title: Senior Software Engineer
        caption: September 2015 - February 2016
        quote: >
          Helped design a single platform to consolidate a payments company's internal applications.
        description: |
          Nexxera brought me in to help build the Hive Platform, a single home for its payment products — card processing and the modules around it — instead of a set of disconnected internal systems.

          We built it with Java and Spring Boot, AngularJS on the front end, and a mix of Oracle, MongoDB and Redis for data, with RabbitMQ for messaging. The product was still in progress when I left, but the architecture and the core services were in place.

          **Stack:** Java, Spring Boot, AngularJS, RabbitMQ, MongoDB, Redis, Oracle

      - layout: left
        title: JExperts Tecnologia
        link: www.jexperts.com.br
        sub_title: Senior Software Engineer
        caption: June 2010 - August 2015
        quote: >
          Led the Channel platform from first commit to a product used for portfolio and strategy management.
        description: |
          At JExperts I led development of Channel, a platform for project, program and portfolio management built around PMBOK and Agile practice, with Balanced Scorecard, KPIs and risk management.

          I ran the delivery side as well as the code: planning, estimating, delegating and keeping the scope honest. Channel was built in Java and JavaEE on WildFly, with AngularJS, Oracle, PostgreSQL and SQL Server.

          **Stack:** Java, JavaEE, AngularJS, Oracle, PostgreSQL, SQL Server, WildFly

      - layout: left
        title: HMW Soluções Tecnológicas LTDA
        sub_title: Co-Founder and Software Engineer
        caption: March 2010 - May 2010
        quote: >
          Co-founded a small company building hospital and process-management software with a public education and culture department.
        description: |
          We built a system for hospital and process management in partnership with the Education and Culture Department. As co-founder I worked across the whole lifecycle — planning, development, and coordinating the small team.

          The stack was Java and JavaEE with JBoss Seam and Hibernate, on Oracle, with SOAP services.

          **Stack:** Java, JavaEE, JBoss Seam, Hibernate, Oracle, SOAP

      - layout: left
        title: Softplan Planejamento de Sistemas LTDA
        link: www.softplan.com.br
        sub_title: Intern Software Engineer
        caption: March 2009 - March 2010
        quote: >
          Built financial and planning tools for public-sector institutions at the start of my career.
        description: |
          My first role: financial solutions for public-sector and multilateral clients such as the Inter-American Development Bank and the International Bank for Reconstruction and Development, plus planning and loan tools for the Ministry of Agrarian Development.

          I worked in Java and JavaEE with JSF, JSP, Struts and Hibernate, against Oracle, SQL Server and PostgreSQL. It taught me early that government software has to be correct, auditable, and usable by people who didn't choose it.

          **Stack:** Java, JavaEE, JSF, JSP, Struts, Hibernate, Oracle, SQL Server, PostgreSQL

